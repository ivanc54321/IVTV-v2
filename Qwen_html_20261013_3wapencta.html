<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky TV - Live Streaming</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: #fff;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 30px;
            border-bottom: 2px solid #0071b9;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(45deg, #00d2ff, #0071b9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-menu {
            display: flex;
            gap: 25px;
        }

        .nav-item {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            padding: 8px 15px;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(0, 113, 185, 0.3);
            color: #00d2ff;
        }

        .search-box {
            margin-left: auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            width: 200px;
        }

        /* Main Content */
        .main-content {
            margin-top: 80px;
            padding: 30px;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, rgba(0, 113, 185, 0.95), rgba(0, 181, 226, 0.9));
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .hero-content h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .live-badge {
            background: #e50914;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Section Title */
        .section-title {
            font-size: 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 30px;
            background: linear-gradient(180deg, #00d2ff, #0071b9);
            border-radius: 2px;
        }

        /* Channel Grid */
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .channel-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .channel-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 113, 185, 0.3);
            border-color: #0071b9;
        }

        .channel-thumb {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #0071b9, #00d2ff);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .channel-thumb img {
            width: 70%;
            height: 70%;
            object-fit: contain;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        .live-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #e50914;
            color: #fff;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
        }

        .channel-info {
            padding: 20px;
        }

        .channel-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .channel-program {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 5px;
        }

        .channel-time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Video Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            width: 90%;
            max-width: 1200px;
            background: #1a1a1a;
            border-radius: 15px;
            overflow: hidden;
        }

        .modal-header {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Category Filter */
        .categories {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .category-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .category-btn:hover, .category-btn.active {
            background: linear-gradient(135deg, #00d2ff, #0071b9);
        }

        @media (max-width: 768px) {
            .hero { flex-direction: column; }
            .channel-grid { grid-template-columns: 1fr; }
            .nav-menu { display: none; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">SKY TV</div>
        <nav class="nav-menu">
            <a href="#" class="nav-item">Search</a>
            <a href="#" class="nav-item">Sports</a>
            <a href="#" class="nav-item active">My TV</a>
            <a href="#" class="nav-item">Movies</a>
            <a href="#" class="nav-item">Entertainment</a>
        </nav>
        <div class="search-box">
            <span>🔍</span>
            <input type="text" placeholder="Search channels...">
        </div>
    </header>

    <main class="main-content">
        <section class="hero">
            <div class="hero-content">
                <div class="hero-meta">
                    <span class="live-badge">● LIVE</span>
                    <span>Sky Sports Premier League</span>
                    <span>• Sport • 2h 15m</span>
                </div>
                <h1>Premier League Live</h1>
                <p>Live coverage from the stadium with expert commentary and analysis</p>
            </div>
        </section>

        <div class="categories">
            <button class="category-btn active" onclick="filterChannels('all')">All Channels</button>
            <button class="category-btn" onclick="filterChannels('Sports')">Sports</button>
            <button class="category-btn" onclick="filterChannels('Movies')">Movies</button>
            <button class="category-btn" onclick="filterChannels('Entertainment')">Entertainment</button>
            <button class="category-btn" onclick="filterChannels('News')">News</button>
        </div>

        <h2 class="section-title">NOW ON TV</h2>
        <div class="channel-grid" id="channelGrid"></div>
    </main>

    <div class="modal" id="videoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Channel</h3>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div class="video-wrapper">
                <iframe id="videoFrame" src="" allowfullscreen allow="autoplay"></iframe>
            </div>
        </div>
    </div>

    <script>
        const channels = [
            { name: "Sky Sports Premier League", program: "Live: Man United vs Liverpool", time: "15:00 - 17:30", category: "Sports", logo: "Sky+Sports+PL", iframe: "https://freeshot.live/embed/SkySportPremierLeague.php" },
            { name: "Sky Sports Football", program: "Championship Live", time: "15:00 - 17:00", category: "Sports", logo: "Sky+Sports+Football", iframe: "https://freeshot.live/embed/SkySportFootball.php" },
            { name: "Sky Sports F1", program: "Formula 1 Grand Prix", time: "14:00 - 17:00", category: "Sports", logo: "Sky+Sports+F1", iframe: "https://freeshot.live/embed/SkySportF1.php" },
            { name: "Sky Sports Cricket", program: "Test Match Live", time: "11:00 - 19:00", category: "Sports", logo: "Sky+Sports+Cricket", iframe: "https://freeshot.live/embed/SkySportCricket.php" },
            { name: "Sky Sports Golf", program: "PGA Tour", time: "13:00 - 20:00", category: "Sports", logo: "Sky+Sports+Golf", iframe: "https://freeshot.live/embed/SkySportGolf.php" },
            { name: "Sky Sports Action", program: "NBA Basketball", time: "20:00 - 23:00", category: "Sports", logo: "Sky+Sports+Action", iframe: "https://freeshot.live/embed/SkySportAction.php" },
            { name: "Sky Sports Tennis", program: "Wimbledon", time: "12:00 - 20:00", category: "Sports", logo: "Sky+Sports+Tennis", iframe: "https://freeshot.live/embed/SkySportsTennisUK.php" },
            { name: "Sky Sports Mix", program: "Sports Highlights", time: "18:00 - 20:00", category: "Sports", logo: "Sky+Sports+Mix", iframe: "https://freeshot.live/embed/SkySportMix.php" },
            { name: "Sky Cinema Premiere", program: "Dune: Part Two", time: "20:00 - 23:00", category: "Movies", logo: "Sky+Cinema", iframe: "https://freeshot.live/embed/SkyCinemaPremiereUK.php" },
            { name: "Sky Cinema Action", program: "Mission Impossible", time: "21:00 - 23:30", category: "Movies", logo: "Sky+Cinema+Action", iframe: "https://freeshot.live/embed/SkyCinemaActionUK.php" },
            { name: "Sky Cinema Family", program: "Encanto", time: "16:00 - 18:00", category: "Movies", logo: "Sky+Cinema+Family", iframe: "https://freeshot.live/embed/SkyCinemaFamilyUK.php" },
            { name: "Sky Atlantic", program: "House of the Dragon", time: "21:00 - 22:00", category: "Entertainment", logo: "Sky+Atlantic", iframe: "https://freeshot.live/embed/SkyAtlanticUK.php" },
            { name: "Sky Comedy", program: "The Office", time: "19:00 - 21:00", category: "Entertainment", logo: "Sky+Comedy", iframe: "https://freeshot.live/embed/SkyComedyUK.php" },
            { name: "Sky Arts", program: "The Arts Show", time: "20:00 - 21:00", category: "Entertainment", logo: "Sky+Arts", iframe: "https://freeshot.live/embed/SkyArtsUK.php" },
            { name: "Sky Showcase", program: "Best of Sky", time: "20:00 - 21:00", category: "Entertainment", logo: "Sky+Showcase", iframe: "https://freeshot.live/embed/SkyShowcase.php" },
            { name: "Sky News", program: "Live News", time: "24/7", category: "News", logo: "Sky+News", iframe: "https://freeshot.live/embed/SkyNews.php" }
        ];

        function renderChannels(filter = 'all') {
            const grid = document.getElementById('channelGrid');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' ? channels : channels.filter(c => c.category === filter);
            
            filtered.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.innerHTML = `
                    <div class="channel-thumb">
                        <span class="live-tag">● LIVE</span>
                        <img src="https://via.placeholder.com/200x120/0071b9/ffffff?text=${ch.logo}" alt="${ch.name}">
                    </div>
                    <div class="channel-info">
                        <div class="channel-name">${ch.name}</div>
                        <div class="channel-program">${ch.program}</div>
                        <div class="channel-time">${ch.time}</div>
                    </div>
                `;
                card.onclick = () => openChannel(ch);
                grid.appendChild(card);
            });
        }

        function openChannel(channel) {
            document.getElementById('modalTitle').textContent = channel.name + ' - ' + channel.program;
            document.getElementById('videoFrame').src = channel.iframe;
            document.getElementById('videoModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('videoFrame').src = '';
            document.getElementById('videoModal').classList.remove('active');
        }

        function filterChannels(category) {
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderChannels(category);
        }

        document.getElementById('videoModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        renderChannels();
    </script>
</body>
</html>
